<!-- The pagefind/ folder is generated by Pagefind after the Jekyll build (see .github/workflows/pages.yml). -->
<link rel="stylesheet" href="{{ '/pagefind/pagefind-component-ui.css' | relative_url }}">
<script type="module" src="{{ '/pagefind/pagefind-component-ui.js' | relative_url }}"></script>

<div class="search">
  <pagefind-config bundle-path="{{ '/pagefind/' | relative_url }}" base-url="{{ '/' | relative_url }}"></pagefind-config>
  <div class="search-bar">
    <pagefind-input></pagefind-input>
    <pagefind-filter-dropdown filter="section" label="Section"></pagefind-filter-dropdown>
  </div>
  <pagefind-summary></pagefind-summary>
  <pagefind-results></pagefind-results>
</div>
