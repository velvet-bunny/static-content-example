---
layout: default
---
{% assign section = site.sections | where: "id", page.section | first %}
<article class="guide" data-pagefind-body data-pagefind-filter="section:{{ section.title }}">
  <p class="breadcrumb" data-pagefind-ignore><a href="{{ section.url | relative_url }}">&larr; {{ section.title }}</a></p>
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
